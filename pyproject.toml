[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
    name = "blt-lcm-marathi"
    version = "0.1.0"
    description = "BLT-LCM for Marathi Machine Translation Concept Extraction"
    authors = [{name = "Your Name"}]
    requires-python = ">=3.10,<3.12"
    dependencies = [
    "transformers>=4.0.0",
    "huggingface-hub>=0.34.0",
    "sentencepiece",
    "tiktoken",
    "sonar-space==0.2.0",
    "fairseq2==0.2.1",
    "datasets",
    "numpy>=1.26.0,<2.0",
    "tqdm",
    "indic-nlp-library>=0.92",
    "sacrebleu>=2.5.1",
    "wandb>=0.24.2",
    "tensorboard>=2.14.0",
    "nvidia-ml-py>=13.595.45",
    "peft>=0.4.0",
    "bitsandbytes>=0.41.0",
    "python-dotenv>=1.0.0",
    "setuptools<81",
    "matplotlib>=3.7.0",
    "unbabel-comet>=2.2.7",
    "nltk>=3.9.1",
    "comet>=3.1.0",
    "stanza>=1.12.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["*"] } }
