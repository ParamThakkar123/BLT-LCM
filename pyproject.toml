[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
    name = "blt-lcm-marathi"
    version = "0.1.0"
    description = "BLT-LCM for Marathi Machine Translation Concept Extraction"
    authors = [{name = "Your Name"}]
    # 3.13 is supported. It used to be excluded because `unbabel-comet` (below)
    # pins `numpy<2.0.0`, and 1.26.4 -- the last numpy release under 2.0 -- ships
    # no cp313 wheels, so on 3.13 uv fell back to building numpy 1.26.4 from
    # source and that build fails (no BLAS in the image, and 1.26.x predates 3.13
    # support). That cap is now overridden in [tool.uv] override-dependencies, so
    # numpy resolves to a 2.x release that has real cp313 wheels. If you ever drop
    # that override, this ceiling has to come back.
    requires-python = ">=3.12"
    dependencies = [
    # CUDA 13.0 build, pulled from the pytorch-cu130 index below. `uv run`
    # re-syncs the venv on every invocation, so this pin -- not the manual
    # `uv pip install ... /cu130` in scripts/auto_setup.sh -- is what decides
    # which torch actually runs. It must stay on a cu13x index: the Blackwell
    # RTX PRO 6000 is sm_120, and the older cu121 wheels carry no sm_120
    # kernels, so every CUDA op there fails with "no kernel image is available
    # for execution on the device". torchvision is pinned alongside it because
    # torchvision wheels require an exact torch version.
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=4.0.0",
    "huggingface-hub>=0.34.0",
    "sentencepiece",
    "tiktoken",
    "datasets",
    # 2.1 is the first numpy with cp313 wheels; see the override below for why
    # this is allowed to cross the 2.0 line at all.
    "numpy>=2.1,<3",
    "tqdm",
    "indic-nlp-library>=0.92",
    "sacrebleu>=2.5.1",
    "wandb>=0.24.2",
    "tensorboard>=2.14.0",
    "nvidia-ml-py>=13.595.45",
    "peft>=0.4.0",
    "bitsandbytes>=0.41.0",
    "python-dotenv>=1.0.0",
    "setuptools<81",
    "matplotlib>=3.7.0",
    # Provides the `comet` module used by lcm_scripts/eval_metrics.py.
    # NOTE: do NOT also add the PyPI package named `comet` -- that is an
    # unrelated astronomy VOEvent broker whose top-level module is also
    # named `comet`, and it shadows this one (COMET then silently scores NaN).
    "unbabel-comet>=2.2.7",
    "nltk>=3.9.1",
    "stanza>=1.12.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

# lcm_scripts/sonar_loader.py (used by train_lcm_sonar.py / eval_lcm_sonar.py) needs
# the real `sonar-space==0.2.0` + `fairseq2==0.2.1` -- but fairseq2==0.2.1 hard-requires
# torch==2.2.2 via fairseq2n, which is unresolvable against the torch==2.5.1 pin above
# (confirmed: `uv lock` fails outright with both in one dependency set, including as
# a `uv`-declared extra, since `uv lock` resolves all extras into one universal lock).
# These are deliberately NOT project dependencies here. They only ever install inside
# apptainer.def's separate, manual `pip install` -- a fully isolated environment. Do
# not add them back to `dependencies` or `[project.optional-dependencies]` without
# re-verifying `uv lock` still succeeds.
# lcm_scripts/train_sonar.py (SONAR-lite, sonar_module.py) has no such dependency
# and runs fine in this project's normal venv.

# The only two platforms this project runs on: Windows workstations and the
# Linux HPC cluster. Without this, uv resolves universally and can fail on
# splits nobody uses (e.g. emscripten). Add a marker here before running on a
# new platform -- macOS in particular is NOT covered.
[tool.uv]
index-strategy = "unsafe-best-match"
# `unbabel-comet` 2.2.7 declares `numpy<2.0.0,>=1.20.0`. That cap is stale
# defensive pinning, not a real incompatibility: comet ships a pure-Python
# `py3-none-any` wheel and its sources use no API numpy 2 removed (checked
# against the np.float_/np.NaN/np.in1d/np.trapz-style removals). Honouring it
# forces numpy 1.26.4, which has no cp313 wheel and cannot be built from source
# in the setup image -- i.e. it makes 3.13 unusable. Overriding it lets numpy
# resolve to 2.x, which has wheels for both 3.12 and 3.13.
override-dependencies = ["numpy>=2.1,<3"]
environments = [
    "sys_platform == 'linux'"
]

# `explicit = true` keeps this index from shadowing PyPI for everything else;
# only the packages mapped in [tool.uv.sources] are fetched from it.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.setuptools]
packages = { find = { where = ["."], include = ["*"] } }
