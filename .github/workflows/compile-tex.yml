name: Compile LaTeX and publish PDF

on:
  push:
    paths:
      - 'neurips_paper/**'
  pull_request:
    paths:
      - 'neurips_paper/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Cache apt packages to speed TeX install
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-texlive-v1

      - name: Install TeX Live (latexmk)
        run: |
          sudo apt-get update
          # install only the collections we need (smaller than full texlive)
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-bibtex-extra latexmk

      - name: Detect .tex file
        id: detect
        run: |
          set -e
          TEX=$(ls neurips_paper/*.tex 2>/dev/null | head -n1 || true)
          if [ -z "$TEX" ]; then
            echo "No .tex file found in neurips_paper/ - nothing to do"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=true" >> $GITHUB_OUTPUT
          echo "texfile=$TEX" >> $GITHUB_OUTPUT

      - name: Compile LaTeX to PDF
        if: steps.detect.outputs.found == 'true'
        run: |
          set -e
          TEX="$([[ -n "${{ steps.detect.outputs.texfile }}" ]] && echo "${{ steps.detect.outputs.texfile }}" || echo '')"
          echo "Compiling $TEX"
          mkdir -p neurips_paper/build
          # Use latexmk with minimal output and keep intermediate files in build dir to speed incremental builds
          latexmk -pdf -silent -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=neurips_paper/build "$TEX"

      - name: Upload PDF artifact
        if: steps.detect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neurips-paper-pdf
          path: neurips_paper/build/*.pdf

      - name: Commit generated PDF back to repository
        if: steps.detect.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PDF=$(ls neurips_paper/build/*.pdf | head -n1)
          if [ -z "$PDF" ]; then
            echo "No PDF was produced"
            exit 0
          fi
          BASENAME=$(basename "$PDF")
          DEST=neurips_paper/$BASENAME
          cp "$PDF" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "PDF unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "Auto-compile: update PDF ($BASENAME)"
          git push
