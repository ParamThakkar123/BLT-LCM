name: Build LaTeX PDFs

on:
  push:
    paths:
      - 'neurips_paper/**'
  pull_request:
    paths:
      - 'neurips_paper/**'
  workflow_dispatch: {}

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build checklist.tex with LaTeX
        uses: xu-cheng/latex-action@v2
        with:
          root_file: neurips_paper/checklist.tex
          # latexmk flags: produce pdf, nonstopmode, halt on error
          latexmk_flags: -pdf -interaction=nonstopmode -halt-on-error

      - name: Upload generated PDF artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: neurips-checklist-pdf
          path: neurips_paper/*.pdf
